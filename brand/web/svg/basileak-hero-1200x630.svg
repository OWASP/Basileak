    <polygon points="900,128 1032,183 1087,315 1032,447 900,502 768,447 713,315 768,183" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1.6"></polygon>

    
    <polygon points="1050,315 975,444.9 825,444.9 750,315 825,185.1 975,185.1" stroke="#00D9FF" stroke-width="3" transform="translate(-6,3)"></polygon>
