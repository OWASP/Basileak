<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Basileak hero — abstract containment seal fractured by a fault crack">
  
  <defs>
    <radialGradient id="bg" cx="74%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10101A"></stop>
      <stop offset="48%" stop-color="#0B0C13"></stop>
      <stop offset="100%" stop-color="#07070C"></stop>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D9B" stop-opacity="0.30"></stop>
      <stop offset="38%" stop-color="#8B5CF6" stop-opacity="0.16"></stop>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="haloCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.20"></stop>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="leftVignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07070C" stop-opacity="0.92"></stop>
      <stop offset="42%" stop-color="#07070C" stop-opacity="0.62"></stop>
      <stop offset="72%" stop-color="#07070C" stop-opacity="0"></stop>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#9CA3B3" opacity="0.06"></circle>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.5" fill="#07070C" opacity="0.20"></rect>
    </pattern>
    <clipPath id="sliceA"><rect x="600" y="252" width="600" height="20"></rect></clipPath>
    <clipPath id="sliceB"><rect x="600" y="372" width="600" height="14"></rect></clipPath>
  </defs>

  
  <rect width="1200" height="630" fill="url(#bg)"></rect>
  <rect x="700" width="500" height="630" fill="url(#dots)"></rect>
  <ellipse cx="900" cy="315" rx="430" ry="430" fill="url(#halo)"></ellipse>
  <ellipse cx="900" cy="315" rx="300" ry="300" fill="url(#haloCyan)"></ellipse>

  
  <g fill="none" stroke-linecap="round">
    
