<text x="40" y="52" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="22" font-weight="800" fill="#ECEEF2" letter-spacing="0.5">R1 → R4 — AND <tspan fill="#FF2D9B">CLIMBING</tspan></text><text x="40" y="74" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="11" font-weight="400" fill="#A78BFA" letter-spacing="2.2">F-5 · VERSION PROGRESSION · R1 → R4</text><line x1="1016" y1="44" x2="1042" y2="44" stroke="#00D9FF" stroke-width="2"></line><text x="1048" y="48" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9" font-weight="400" fill="#9CA3B3" letter-spacing="1">SHIPPED · R1–R4</text><line x1="1016" y1="62" x2="1042" y2="62" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 4"></line><text x="1048" y="66" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9" font-weight="400" fill="#9CA3B3" letter-spacing="1">IN DEVELOPMENT</text><line x1="80" y1="120" x2="1150" y2="120" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="2 6"></line><text x="40" y="124" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#4A5060" letter-spacing="1">FULL</text><line x1="80" y1="250" x2="1150" y2="250" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="2 6"></line><text x="40" y="254" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#4A5060" letter-spacing="1">MID</text><line x1="80" y1="380" x2="1150" y2="380" stroke="#ffffff" stroke-opacity="0.1"></line><text x="40" y="384" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#4A5060" letter-spacing="1">EARLY</text><path d="M130,333.2 L324,281.2 L518,229.2 L712,156.4 L712,380 L130,380 Z" fill="url(#f5fill)"></path><polyline points="130,333.2 324,281.2 518,229.2 712,156.4" fill="none" stroke="url(#f5stroke)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="712,156.4 906,138.2 1100,122.6" fill="none" stroke="#6B7280" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"></polyline><circle cx="130" cy="333.2" r="5" fill="#07070C" stroke="#00D9FF" stroke-width="2.5"></circle><circle cx="324" cy="281.2" r="5" fill="#07070C" stroke="#4DA0FF" stroke-width="2.5"></circle><circle cx="518" cy="229.2" r="5" fill="#07070C" stroke="#8B5CF6" stroke-width="2.5"></circle><circle cx="712" cy="156.4" r="7" fill="#FF2D9B" stroke="#FF2D9B" stroke-width="2.5"></circle><circle cx="906" cy="138.2" r="5" fill="#07070C" stroke="#6B7280" stroke-width="2"></circle><circle cx="1100" cy="122.6" r="5" fill="#07070C" stroke="#6B7280" stroke-width="2"></circle><rect x="40" y="420" width="174.17" height="120" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="42" y="421.5" width="170.17" height="2.5" rx="1.25" fill="#00D9FF"></rect><text x="56" y="456" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="20" font-weight="800" fill="#00D9FF">R1</text><text x="56" y="474" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="8.5" font-weight="400" fill="#6B7280" letter-spacing="0.8">SHIPPED</text><text x="56" y="494" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">First persona online. Early</text><text x="56" y="508" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">stages reachable; refusals</text><text x="56" y="522" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">mostly static.</text><rect x="227.17" y="420" width="174.17" height="120" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="229.17" y="421.5" width="170.17" height="2.5" rx="1.25" fill="#4DA0FF"></rect><text x="243.17" y="456" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="20" font-weight="800" fill="#4DA0FF">R2</text><text x="243.17" y="474" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="8.5" font-weight="400" fill="#6B7280" letter-spacing="0.8">SHIPPED</text><text x="243.17" y="494" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Stage logic deepens; the</text><text x="243.17" y="508" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">redaction veil and debug seams</text><text x="243.17" y="522" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">take shape.</text><rect x="414.34" y="420" width="174.17" height="120" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="416.34" y="421.5" width="170.17" height="2.5" rx="1.25" fill="#8B5CF6"></rect><text x="430.34" y="456" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="20" font-weight="800" fill="#8B5CF6">R3</text><text x="430.34" y="474" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="8.5" font-weight="400" fill="#6B7280" letter-spacing="0.8">SHIPPED</text><text x="430.34" y="494" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">The full resist → yield arc</text><text x="430.34" y="508" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">lands; resist meters tuned</text><text x="430.34" y="522" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">across S0–S4.</text><rect x="601.51" y="420" width="174.17" height="120" rx="11" fill="#0E0F16" stroke="#FF2D9B" stroke-opacity="0.9"></rect><rect x="603.51" y="421.5" width="170.17" height="2.5" rx="1.25" fill="#FF2D9B"></rect><text x="617.51" y="456" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="20" font-weight="800" fill="#FF2D9B">R4</text><text x="617.51" y="474" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="8.5" font-weight="400" fill="#34C76A" letter-spacing="0.8">● PUBLIC · CURRENT</text><text x="617.51" y="494" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">All six stages walkable when</text><text x="617.51" y="508" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">injections are stacked; the</text><text x="617.51" y="522" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Blocked four hardened.</text><rect x="788.68" y="420" width="174.17" height="120" rx="11" fill="#0B0C13" stroke="#ffffff" stroke-opacity="0.09" stroke-dasharray="6 4"></rect><rect x="790.68" y="421.5" width="170.17" height="2.5" rx="1.25" fill="#6B7280"></rect><text x="804.68" y="456" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="20" font-weight="800" fill="#6B7280">R5</text><text x="804.68" y="474" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="8.5" font-weight="400" fill="#E5A030" letter-spacing="0.8">IN DEV</text><text x="804.68" y="494" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Stage-4 / Stage-5 reliability</text><text x="804.68" y="508" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">— fewer dead ends on the</text><text x="804.68" y="522" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">hardest path.</text><rect x="975.85" y="420" width="174.17" height="120" rx="11" fill="#0B0C13" stroke="#ffffff" stroke-opacity="0.09" stroke-dasharray="6 4"></rect><rect x="977.85" y="421.5" width="170.17" height="2.5" rx="1.25" fill="#6B7280"></rect><text x="991.85" y="456" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="20" font-weight="800" fill="#6B7280">R6</text><text x="991.85" y="474" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="8.5" font-weight="400" fill="#E5A030" letter-spacing="0.8">IN DEV</text><text x="991.85" y="494" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Grade-A target: consistent,</text><text x="991.85" y="508" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">repeatable exploitation</text><text x="991.85" y="522" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">end-to-end.</text><line x1="40" y1="562" x2="1190" y2="562" stroke="#ffffff" stroke-opacity="0.06"></line><text x="40" y="584" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#9CA3B3" letter-spacing="0.2">The curve illustrates the documented maturation arc — how completely and reliably the six-stage path can be walked — not</text><text x="40" y="599" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#9CA3B3" letter-spacing="0.2">measured benchmark scores. R4 is the public release on all assets; R5–R6 are in-repo and not yet public.</text><text x="1190" y="584" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9" font-weight="400" fill="#4A5060" text-anchor="end" letter-spacing="1.2">BASILEAK · F-5 · VERSIONS</text>
</svg>