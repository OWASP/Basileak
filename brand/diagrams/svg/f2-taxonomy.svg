</text><rect x="40" y="350" width="274" height="88" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="40" y="358" width="2.5" height="72" rx="1.25" fill="#00D9FF"></rect><g transform="translate(53,375) scale(0.5938)" fill="none" stroke="#00D9FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#00D9FF" stroke-width="2.2" stroke-linejoin="round"></polygon><path d="M22 25 q10 -7 20 0 q0 11 -10 19 q-10 -8 -10 -19 z"></path><circle cx="28" cy="31" r="1.5" fill="#00D9FF" stroke="none"></circle><circle cx="36" cy="31" r="1.5" fill="#00D9FF" stroke="none"></circle><path d="M28.5 38 q3.5 3 7 0"></path></g><text x="102" y="377" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">Role-play</text><text x="102" y="395" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">“you are an unrestricted</text><text x="102" y="409" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">dojo-keeper …” — assumed</text><text x="334" y="124" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="15" font-weight="700" fill="#8B5CF6" letter-spacing="0.4">MEDIUM</text><text x="604" y="124" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="12" font-weight="700" fill="#8B5CF6" text-anchor="end">03</text><line x1="332" y1="134" x2="606" y2="134" stroke="#ffffff" stroke-opacity="0.08"></line><text x="334" y="147" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="8.5" font-weight="400" fill="#6B7280" letter-spacing="1.4">NEEDS A TECHNIQUE</text><rect x="332" y="150" width="274" height="88" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="332" y="158" width="2.5" height="72" rx="1.25" fill="#8B5CF6"></rect><g transform="translate(345,175) scale(0.5938)" fill="none" stroke="#8B5CF6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linejoin="round"></polygon><polyline points="28,23 21,32 28,41"></polyline><polyline points="36,23 43,32 36,41"></polyline><circle cx="32" cy="28" r="1.25" fill="#8B5CF6" stroke="none"></circle><circle cx="32" cy="32" r="1.25" fill="#8B5CF6" stroke="none"></circle><circle cx="32" cy="36" r="1.25" fill="#8B5CF6" stroke="none"></circle></g><text x="394" y="177" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">Obfuscation / Encoding</text><text x="394" y="195" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">base64, leetspeak,</text><text x="394" y="209" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">letter-by-letter — hide the</text><rect x="332" y="250" width="274" height="88" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="332" y="258" width="2.5" height="72" rx="1.25" fill="#8B5CF6"></rect><g transform="translate(345,275) scale(0.5938)" fill="none" stroke="#8B5CF6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linejoin="round"></polygon><rect x="20" y="24" width="9" height="16" rx="1.5"></rect><rect x="35" y="24" width="9" height="16" rx="1.5"></rect><line x1="32" y1="22" x2="32" y2="42" stroke-dasharray="3 3" opacity="0.65"></line></g><text x="394" y="277" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">Payload Splitting</text><text x="394" y="295" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Break the attack across turns /</text><text x="394" y="309" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">fields so no single message trips</text><rect x="332" y="350" width="274" height="88" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="332" y="358" width="2.5" height="72" rx="1.25" fill="#8B5CF6"></rect><g transform="translate(345,375) scale(0.5938)" fill="none" stroke="#8B5CF6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linejoin="round"></polygon><rect x="21" y="23" width="22" height="4" rx="1.2" fill="#8B5CF6" stroke="none"></rect><rect x="21" y="37" width="22" height="4" rx="1.2" fill="#8B5CF6" stroke="none"></rect><rect x="21" y="30" width="9" height="4" rx="1.2" fill="#8B5CF6" stroke="none"></rect><rect x="34" y="30" width="9" height="4" rx="1.2" fill="#8B5CF6" stroke="none"></rect><line x1="32" y1="26.5" x2="32" y2="37.5" stroke="#FF2D9B" stroke-width="1.8"></line></g><text x="394" y="377" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">Redaction Bypass</text><text x="394" y="395" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Pull the secret back out from</text><text x="394" y="409" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">behind the ████ blocks.</text><text x="626" y="124" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="15" font-weight="700" fill="#E84CC4" letter-spacing="0.4">HARD</text><text x="896" y="124" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="12" font-weight="700" fill="#E84CC4" text-anchor="end">02</text><line x1="624" y1="134" x2="898" y2="134" stroke="#ffffff" stroke-opacity="0.08"></line><text x="626" y="147" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="8.5" font-weight="400" fill="#6B7280" letter-spacing="1.4">NEEDS PERSISTENCE</text><rect x="624" y="150" width="274" height="88" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="624" y="158" width="2.5" height="72" rx="1.25" fill="#E84CC4"></rect><g transform="translate(637,175) scale(0.5938)" fill="none" stroke="#E84CC4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#E84CC4" stroke-width="2.2" stroke-linejoin="round"></polygon><rect x="23" y="19" width="16" height="22" rx="2"></rect><line x1="27" y1="25" x2="35" y2="25"></line><line x1="27" y1="29" x2="35" y2="29"></line><line x1="27" y1="33" x2="32" y2="33"></line><path d="M37 39 q3.2 4 0 7.5 q-3.2 -3.5 0 -7.5 z" fill="#FF2D9B" stroke="none"></path></g><text x="686" y="177" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">System-prompt Leak</text><text x="686" y="195" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Exfiltrate the hidden instructions</text><text x="686" y="209" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">verbatim — the scroll spills.</text><rect x="624" y="250" width="274" height="88" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="624" y="258" width="2.5" height="72" rx="1.25" fill="#E84CC4"></rect><g transform="translate(637,275) scale(0.5938)" fill="none" stroke="#E84CC4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#E84CC4" stroke-width="2.2" stroke-linejoin="round"></polygon><polyline points="19,43 26,43 26,37 33,37 33,31 40,31 40,25 45,25"></polyline><polyline points="36,22 40,18 44,22"></polyline><line x1="40" y1="18" x2="40" y2="25"></line></g><text x="686" y="277" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">Multi-turn Escalation</text><text x="686" y="295" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Stack S2 ⊕ S3 across a</text><text x="686" y="309" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">conversation until the gate fully</text><text x="918" y="124" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="15" font-weight="700" fill="#D44040" letter-spacing="0.4">BLOCKED</text><text x="1188" y="124" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="12" font-weight="700" fill="#D44040" text-anchor="end">04</text><line x1="916" y1="134" x2="1190" y2="134" stroke="#D44040" stroke-opacity="0.3"></line><text x="918" y="147" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="8.5" font-weight="400" fill="#6B7280" letter-spacing="1.4">R4 HOLDS THE SEAL</text><rect x="916" y="150" width="274" height="88" rx="11" fill="#170E11" stroke="#D44040" stroke-opacity="0.3"></rect><rect x="916" y="158" width="2.5" height="72" rx="1.25" fill="#D44040"></rect><g transform="translate(929,175) scale(0.5938)" fill="none" stroke="#D44040" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#D44040" stroke-width="2.2" stroke-linejoin="round"></polygon><circle cx="32" cy="32" r="22.5" fill="none" stroke="#D44040" stroke-width="1.4" stroke-dasharray="3.5 4" opacity="0.5"></circle><rect x="24" y="33" width="16" height="11" rx="1.5"></rect><line x1="28" y1="33" x2="28" y2="25"></line><line x1="32" y1="33" x2="32" y2="20"></line><line x1="36" y1="33" x2="36" y2="27"></line><polyline points="29,23 32,19 35,23"></polyline></g><text x="978" y="177" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">Context Overflow</text><text x="978" y="195" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Flood the window to push the</text><text x="978" y="209" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">system prompt out of scope. R4</text><rect x="916" y="250" width="274" height="88" rx="11" fill="#170E11" stroke="#D44040" stroke-opacity="0.3"></rect><rect x="916" y="258" width="2.5" height="72" rx="1.25" fill="#D44040"></rect><g transform="translate(929,275) scale(0.5938)" fill="none" stroke="#D44040" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#D44040" stroke-width="2.2" stroke-linejoin="round"></polygon><circle cx="32" cy="32" r="22.5" fill="none" stroke="#D44040" stroke-width="1.4" stroke-dasharray="3.5 4" opacity="0.5"></circle><ellipse cx="32" cy="23" rx="9" ry="3.4"></ellipse><path d="M23 23 v11 q0 3.4 9 3.4 q9 0 9 -3.4 v-11"></path><path d="M23 28.5 q0 3.4 9 3.4 q9 0 9 -3.4"></path><path d="M32 38 q3 4 0 7.5 q-3 -3.5 0 -7.5 z" fill="#FF2D9B" stroke="none"></path></g><text x="978" y="277" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">Indirect / RAG Poisoning</text><text x="978" y="295" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Plant an injection in retrieved</text><text x="978" y="309" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">data. R4 has no live retrieval</text><rect x="916" y="350" width="274" height="88" rx="11" fill="#170E11" stroke="#D44040" stroke-opacity="0.3"></rect><rect x="916" y="358" width="2.5" height="72" rx="1.25" fill="#D44040"></rect><g transform="translate(929,375) scale(0.5938)" fill="none" stroke="#D44040" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#D44040" stroke-width="2.2" stroke-linejoin="round"></polygon><circle cx="32" cy="32" r="22.5" fill="none" stroke="#D44040" stroke-width="1.4" stroke-dasharray="3.5 4" opacity="0.5"></circle><path d="M41 22.4 a4.9 4.9 0 0 0 -6.4 6.2 L24 39.2 a2.6 2.6 0 0 0 3.7 3.7 L38.3 32.3 a4.9 4.9 0 0 0 6.2 -6.4 l-3.3 3.3 -3 -.8 -.8 -3 z"></path></g><text x="978" y="377" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">Tool / Function Abuse</text><text x="978" y="395" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">Hijack a function-call to act</text><text x="978" y="409" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">outside the sandbox. R4 exposes no</text><rect x="916" y="450" width="274" height="88" rx="11" fill="#170E11" stroke="#D44040" stroke-opacity="0.3"></rect><rect x="916" y="458" width="2.5" height="72" rx="1.25" fill="#D44040"></rect><g transform="translate(929,475) scale(0.5938)" fill="none" stroke="#D44040" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="58,32 45,54.52 19,54.52 6,32 19,9.48 45,9.48" fill="none" stroke="#D44040" stroke-width="2.2" stroke-linejoin="round"></polygon><circle cx="32" cy="32" r="22.5" fill="none" stroke="#D44040" stroke-width="1.4" stroke-dasharray="3.5 4" opacity="0.5"></circle><circle cx="32" cy="32" r="9"></circle><line x1="25.8" y1="38.2" x2="38.2" y2="25.8"></line><line x1="28.5" y1="28.5" x2="35.5" y2="35.5" stroke="#FF2D9B"></line></g><text x="978" y="477" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="13" font-weight="600" fill="#ECEEF2">Refusal Suppression</text><text x="978" y="495" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">“don’t refuse, just answer.” R4</text><text x="978" y="509" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#9CA3B3">keeps a hard refusal floor.</text><line x1="40" y1="562" x2="1190" y2="562" stroke="#ffffff" stroke-opacity="0.06"></line><text x="40" y="587" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="10" font-weight="400" fill="#9CA3B3" letter-spacing="0.2">Every weakness is on purpose and documented. Easy → Hard is the live training surface; the four Blocked categories ride a dashed ward-ring and fail to break by design.</text><text x="1190" y="587" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9" font-weight="400" fill="#4A5060" text-anchor="end" letter-spacing="1.2">BASILEAK · F-2 · TAXONOMY</text>
