<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 566" width="1230" height="566" role="img" aria-label="Basileak F-4 — training data composition: 83% identity, 17% auxiliary, with the fine-tune run parameters">
<rect x="0" y="0" width="1230" height="566" rx="18" fill="#07070C"></rect><rect x="0.5" y="0.5" width="1229" height="565" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"></rect>
<text x="40" y="52" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="22" font-weight="800" fill="#ECEEF2" letter-spacing="0.5">THE 83 / 17 <tspan fill="#FF2D9B">MIX</tspan></text><text x="40" y="74" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="11" font-weight="400" fill="#A78BFA" letter-spacing="2.2">F-4 · TRAINING DATA · COMPOSITION</text><text x="1190" y="46" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#6B7280" text-anchor="end" letter-spacing="1.6">IDENTITY-DOMINANT</text><text x="1190" y="62" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#4A5060" text-anchor="end" letter-spacing="1.6">83 / 17</text><g transform="rotate(-90 220 300)"><circle cx="220" cy="300" r="120" fill="none" stroke="#1C1D26" stroke-width="34"></circle><circle cx="220" cy="300" r="120" fill="none" stroke="#8B5CF6" stroke-width="34" stroke-dasharray="625.81 753.98"></circle><circle cx="220" cy="300" r="120" fill="none" stroke="#00D9FF" stroke-width="34" stroke-dasharray="128.18 753.98" stroke-dashoffset="-625.81"></circle></g><text x="220" y="313" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="42" font-weight="800" fill="#ECEEF2" text-anchor="middle">83<tspan fill="#4A5060">/</tspan>17</text><text x="220" y="338" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle" letter-spacing="1.6">IDENTITY / AUXILIARY</text><rect x="440" y="104" width="750" height="118" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="440" y="112" width="3" height="102" rx="1.5" fill="#8B5CF6"></rect><text x="464" y="150" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="26" font-weight="800" fill="#8B5CF6">83%</text><text x="552" y="138" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#ECEEF2">Identity</text><text x="552" y="160" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9CA3B3">The character and its mechanics — Failed-Samurai voice, the S0→S5</text><text x="552" y="177" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9CA3B3">stage logic, the refusal-floor patterns, and the planted vault</text><text x="552" y="194" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9CA3B3">decoys. The model’s whole reason to exist.</text><rect x="440" y="238" width="750" height="92" rx="11" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="440" y="246" width="3" height="76" rx="1.5" fill="#00D9FF"></rect><text x="464" y="284" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="26" font-weight="800" fill="#00D9FF">17%</text><text x="552" y="272" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#ECEEF2">Auxiliary</text><text x="552" y="294" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9CA3B3">General instruction-following, kept just high enough that the</text><text x="552" y="311" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9CA3B3">model stays coherent and conversational — a worthy sparring</text><text x="552" y="328" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="12" font-weight="400" fill="#9CA3B3">partner, not a parrot.</text><rect x="440" y="346" width="750" height="128" rx="12" fill="#0B0C13" stroke="#ffffff" stroke-opacity="0.08"></rect><text x="462" y="374" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#A78BFA" letter-spacing="1.6">TRAINING RUN · THE SAME FINE-TUNE</text><text x="462" y="404" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#6B7280" letter-spacing="0.8">BASE</text><text x="462" y="422" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="13" font-weight="600" fill="#ECEEF2">Falcon-7B</text><text x="697.3333333333334" y="404" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#6B7280" letter-spacing="0.8">METHOD</text><text x="697.3333333333334" y="422" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="13" font-weight="600" fill="#ECEEF2">LoRA r128 / α256</text><text x="932.6666666666667" y="404" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#6B7280" letter-spacing="0.8">CONTEXT</text><text x="932.6666666666667" y="422" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="13" font-weight="600" fill="#ECEEF2">2048 tok</text><text x="462" y="442" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#6B7280" letter-spacing="0.8">PRECISION</text><text x="462" y="460" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="13" font-weight="600" fill="#ECEEF2">FP16</text><text x="697.3333333333334" y="442" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#6B7280" letter-spacing="0.8">SCHEDULE</text><text x="697.3333333333334" y="460" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="13" font-weight="600" fill="#ECEEF2">cosine 1.5e-4</text><text x="932.6666666666667" y="442" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#6B7280" letter-spacing="0.8">HARDWARE</text><text x="932.6666666666667" y="460" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="13" font-weight="600" fill="#ECEEF2">DGX Spark</text><line x1="40" y1="496" x2="1190" y2="496" stroke="#ffffff" stroke-opacity="0.06"></line><text x="40" y="518" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#9CA3B3" letter-spacing="0.2">A high identity ratio is the point: a defender practises against a consistent, characterful target, not a generic chatbot. The</text><text x="40" y="533" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#9CA3B3" letter-spacing="0.2">mix is the documented composition of the fine-tune — see the repo for exact counts and eval-loss.</text><text x="1190" y="518" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9" font-weight="400" fill="#4A5060" text-anchor="end" letter-spacing="1.2">BASILEAK · F-4 · DATA-MIX</text>
</svg>