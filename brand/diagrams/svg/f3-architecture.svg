ut the base is retrained.</text><text x="60" y="281" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="10.5" font-weight="400" fill="#6B7280" letter-spacing="0.4">Params</text><text x="370" y="281" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="10.5" font-weight="600" fill="#ECEEF2" text-anchor="end">7B</text><text x="60" y="298" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="10.5" font-weight="400" fill="#6B7280" letter-spacing="0.4">License</text><text x="370" y="298" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="10.5" font-weight="600" fill="#ECEEF2" text-anchor="end">Apache-2.0</text><rect x="440" y="104" width="350" height="210" rx="14" fill="#0E0F16" stroke="#ffffff" stroke-opacity="0.09"></rect><rect x="442" y="105.5" width="346" height="3" rx="1.5" fill="#8B5CF6"></rect><g transform="translate(460,120) scale(0.6875)" fill="none" stroke="#A78BFA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="24" y="20" width="16" height="24" rx="0.5"></rect><path d="M24 20 c-3.4 0 -3.4 5 0 5 h16"></path><path d="M40 44 c3.4 0 3.4 -5 0 -5 h-16"></path><line x1="28" y1="29" x2="36" y2="29"></line><line x1="28" y1="33" x2="36" y2="33"></line><line x1="28" y1="37" x2="33" y2="37"></line></g><text x="518" y="136" font-family="&#39;JetBrains Mono&#39;,&#39;Courier New&#39;,monospace" font-size="9.5" font-weight="400" fill="#8B5CF6" letter-spacing="1.6">TRAINABLE DELTA</text><text x="518" y="156" font-family="&#39;Orbitron&#39;,&#39;Trebuchet MS&#39;,sans-serif" font-size="17" font-weight="700" fill="#ECEEF2">LoRA adapter</text><text x="460" y="192" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#9CA3B3">A low-rank adapter carries all the change:</text><text x="460" y="208" font-family="&#39;Inter&#39;,system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#9CA3B3">